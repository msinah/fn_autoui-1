loginpage:
  - title: 蜂鸟定制 | 自发货订单
    des: fbm购物车下单
    skip: False
    need_cookie: True    #是否需要登录cookie，默认是“是”，可不写
    cases:

      - name: 打开我的产品页面
        switch_to_page: False
        method: goto
        url: /fn/shoppingCart2

      - name: 点击装箱发货
        switch_to_page: False
        method: click
        locator: //*[self::button or self::span or self::label][normalize-space()='装箱发货' or .//*[normalize-space()='装箱发货']][1]

      - name: 请选择店铺编号
        switch_to_page: False
        method: click
        locator: get_by_role("textbox", name="请选择店铺编号")

      - name: 选择亚马逊美国店
        switch_to_page: False
        method: click
        locator: get_by_text("亚马逊美国店", exact=True)

      - name: 请选择配送方式
        switch_to_page: False
        method: click
        locator: get_by_role("textbox", name="请选择配送方式")

      - name: 国内物流
        switch_to_page: False
        method: click
        locator: get_by_text("国内物流", exact=True)

      - name: 请选择贴标状态
        switch_to_page: False
        method: click
        locator: get_by_role("textbox", name="请选择贴标状态")

      - name: 贴标-是
        switch_to_page: False
        method: click
        locator: get_by_role("listitem").filter(has_text="是")

      - name: 修改地址
        switch_to_page: False
        method: click
        locator: get_by_role("button",name="修改地址")
      
      - name: 选择收货地址
        switch_to_page: False
        method: click
        locator: get_by_role("button", name="选择").first

      - name: 选择已有的贴标信息
        switch_to_page: False
        method: click
        locator: get_by_text("选择已有的贴标信息")

      - name: 贴标信息-选择
        switch_to_page: False
        method: click
        locator: get_by_role("button", name="选择").first

      # - name: 输入FNSKU
      #   switch_to_page: False
      #   method: fill
      #   locator: get_by_role("textbox", name="请输入FNSKU")
      #   value: X015623658


      # - name: 输入SKU
      #   switch_to_page: False
      #   method: fill
      #   locator: get_by_role("textbox", name="请输入SKU")
      #   value: X015623659

      # - name: 选择sku
      #   switch_to_page: False
      #   method: click
      #   locator: get_by_role("button", name="选择").first


      # - name: 请选择贴标区域
      #   switch_to_page: False
      #   method: click
      #   locator: get_by_role("textbox", name="请选择", exact=True)

      # - name: 选择产品包装
      #   switch_to_page: False
      #   method: click
      #   locator: get_by_text("产品包装")

      - name: 立即支付
        switch_to_page: False
        method: click
        locator: //button[not(@disabled) and .//span[normalize-space()="立即支付"]]
        wait_after_locator: //button[not(@disabled) and .//span[normalize-space()="确认支付"]]
        wait_after_timeout: 15000

      - name: 确认支付
        switch_to_page: False
        method: click
        locator: //button[not(@disabled) and .//span[normalize-space()="确认支付"]]

      - name: 查看订单
        switch_to_page: False
        method: click
        locator: //button[.//span[normalize-space()="查看订单"]] | //span[normalize-space()="查看订单"]

    assertion: 蜂鸟定制 | 头程订单

