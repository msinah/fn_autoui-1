[pytest]
# -s 显示 print/日志，-v 显示详细用例名；每次运行重新生成 Allure 原始结果。
addopts = -s -v --alluredir=./report/temp --clean-alluredir

# pytest 只从该目录开始收集测试。
testpaths = ./testCases

# 文件、测试类和测试函数必须分别符合以下命名规则。
python_files = test_*.py

python_classes = Test*

python_functions = test_*

# 自定义分组标记；可使用 pytest -m P1 等方式筛选。
markers =
    last
    second
    first
    P1
    P2
    P3
